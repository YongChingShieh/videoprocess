name: Build VideoExtract EXE

on:
  workflow_dispatch: # 仅在 GitHub Actions 界面手动点击运行

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 配置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 3. 安装 PyInstaller 及项目依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # 如果 python 目录下有 requirements.txt，可以安装它：
        if (Test-Path "python/requirements.txt") { pip install -r python/requirements.txt }

# 4. 进入 python 目录并执行打包
    - name: Build with PyInstaller
      run: |
        cd python
        $pynv_dir = (python -c "import PyNvVideoCodec, os; print(os.path.dirname(PyNvVideoCodec.__file__))").Trim()
        pyinstaller --onefile --add-data="${pynv_dir};PyNvVideoCodec" videoextract.py

    # 5. 上传生成的 exe 文件
    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: videoextract-exe
        # cd python 之后生成的 dist 文件夹位于 python/dist/
        path: python/dist/*.exe
