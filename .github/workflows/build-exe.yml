name: Build VideoExtract EXE

on:
  workflow_dispatch: # 仅在 GitHub Actions 界面手动点击运行

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 配置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 3. 安装 PyInstaller 及项目依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path "python/requirements.txt") { pip install -r python/requirements.txt }

    # 4. 进入 python 目录并执行打包
    - name: Build with PyInstaller
      working-directory: python
      run: |
        pyinstaller videoextract.spec

    # 5. 上传生成的文件夹（包含 exe 及其所有依赖 dll）
    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: videoextract-exe
        # 修改为整个文件夹路径（PyInstaller 打包默认输出路径为 python/dist/videoextract）
        path: python/dist/videoextract/
