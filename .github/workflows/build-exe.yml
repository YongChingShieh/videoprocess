name: Build VideoExtract EXE

on:
  workflow_dispatch: # 仅在 GitHub Actions 界面手动点击运行

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 拉取代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 配置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 3. 设置 MSVC 编译器环境 (windows-latest 已内置 Visual Studio，需激活环境变量)
    - name: Setup MSVC developer command prompt
      uses: ilammy/msvc-dev-cmd@v1

    # 4. 安装 Nuitka 及项目依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka zstandard
        if (Test-Path "python/requirements.txt") { pip install -r python/requirements.txt }

    # 5. 进入 python 目录并执行 Nuitka 打包
    - name: Build with Nuitka
      working-directory: python
      run: |
        nuitka --standalone `
               --onefile `
               --assume-yes-for-downloads `
               --include-data-files="config.yaml=config.yaml" `
               --output-dir=dist `
               --output-filename=videoextract.exe `
               videoextract.py

    # 6. 上传生成的 EXE 文件
    - name: Upload Executable
      uses: actions/upload-artifact@v4
      with:
        name: videoextract-exe
        # --onefile 打包模式下，输出文件在 dist 目录下
        path: python/dist/videoextract.exe
